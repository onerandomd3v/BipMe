name: Forge release preparation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['forge-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forge-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag names the exact commit
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "forge-$GITHUB_SHA"
      - name: Check quota, isolation and release rendering
        run: |
          python3 infra/forge/test_manifests.py
          python3 infra/forge/render.py --sha "$GITHUB_SHA" --storage-class ci-validation-only
          docker run --rm -v "$PWD/infra/forge/rendered:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.30.0 /manifests
      - name: Build existing frontend image
        run: docker build --platform linux/amd64 -f apps/web/Dockerfile -t bipme-forge-web:test .
      - name: Verify Forge DNS, forwarding and response security
        run: python3 infra/forge/smoke_proxy.py

  forge-images:
    needs: forge-validation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: bipme-api
            dockerfile: apps/api/Dockerfile
          - image: bipme-web
            dockerfile: apps/web/Dockerfile
          - image: bipme-postgres
            dockerfile: infra/forge/postgres.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>manifest-error.txt; then
            echo 'Release tag already exists; retain its recorded digest. Never overwrite.' >&2
            exit 1
          fi
          if ! grep -Eq 'manifest unknown|no such manifest' manifest-error.txt; then
            echo 'Cannot establish release tag absence; refusing publication.' >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable release digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
