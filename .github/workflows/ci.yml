name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  workspace-checks:
    name: workspace-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          required = [
              "AGENTS.md",
              "compose.yaml",
              "apps/api/pyproject.toml",
              "apps/api/uv.lock",
              "apps/api/src/bipme/api/app.py",
              "apps/web/package.json",
              "apps/web/pnpm-lock.yaml",
              "apps/web/src/App.tsx",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          PY
      - name: Check service environment boundaries
        run: python3 scripts/check_env_boundaries.py
      - name: Validate Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f infra/brev-embedding/compose.yaml --env-file infra/brev-embedding/.env.example config --quiet

  api-checks:
    name: api-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bipme_test
          POSTGRES_USER: bipme
          POSTGRES_PASSWORD: bipme_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bipme -d bipme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIPME_DATABASE_URL: postgresql+psycopg://bipme:bipme_test_only@127.0.0.1:5432/bipme_test
      BIPME_TEST_DATABASE_URL: postgresql+psycopg://bipme:bipme_test_only@127.0.0.1:5432/bipme_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check src tests alembic
      - name: Ruff format
        run: uv run ruff format --check src tests alembic
      - name: Python types
        run: uv run mypy src
      - name: PostgreSQL worker process restart verification
        timeout-minutes: 3
        run: |
          test -n "$BIPME_TEST_DATABASE_URL"
          uv run pytest -q tests/test_worker_process.py
      - name: Python tests
        run: uv run pytest -q --ignore=tests/test_worker_process.py

  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Generated API contract
        run: pnpm check:api
      - name: TypeScript
        run: pnpm typecheck
      - name: Web tests
        run: pnpm test
      - name: Build
        run: pnpm build
