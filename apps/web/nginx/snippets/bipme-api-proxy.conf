proxy_pass ${BIPME_API_UPSTREAM}$request_uri;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
proxy_ssl_verify_depth 3;
proxy_set_header Connection "";
proxy_set_header Host $bipme_forwarded_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $bipme_forwarded_host;
proxy_set_header X-Forwarded-Proto $bipme_forwarded_proto;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header Authorization $http_authorization;
proxy_set_header Origin $http_origin;
proxy_redirect off;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 1h;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
add_header Cache-Control "private, no-store" always;
include /etc/nginx/snippets/bipme-security-headers.conf;
