# No URI component: preserve the entire original /api path and query string.
if ($bipme_bad_origin) { return 403; }
proxy_pass http://bipme_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Fixed deployment origin, never caller-provided forwarding metadata.
proxy_set_header Host team17.xtradot.co;
proxy_set_header X-Forwarded-Host team17.xtradot.co;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header Authorization $http_authorization;
proxy_set_header Origin $http_origin;
proxy_redirect off;
proxy_next_upstream off;
proxy_buffering off;
proxy_request_buffering off;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
add_header Cache-Control "private, no-store" always;
include /etc/nginx/snippets/bipme-security-headers.conf;
