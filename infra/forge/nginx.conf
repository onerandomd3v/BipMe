# Mounted over the existing image template; the existing entrypoint still renders it.
# Resolve the stable ClusterIP Service with the pod's system resolver at startup.
upstream bipme_api {
    server api.team17.svc.cluster.local:8000;
}

map "$request_method:$http_origin" $bipme_bad_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    "POST:https://team17.xtradot.co" 0;
    "PUT:https://team17.xtradot.co" 0;
    "PATCH:https://team17.xtradot.co" 0;
    "DELETE:https://team17.xtradot.co" 0;
}

server {
    listen 8080;
    server_name team17.xtradot.co;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Do not record URLs, query strings, cookies, or authorization headers.
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 64k;
    include /etc/nginx/snippets/bipme-security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api { include /tmp/bipme-api-proxy.conf; }
    location ^~ /api/ { include /tmp/bipme-api-proxy.conf; }
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}[.](?:avif|css|eot|gif|ico|jpe?g|js|png|svg|ttf|webp|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/bipme-security-headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bipme-security-headers.conf;
    }
}
