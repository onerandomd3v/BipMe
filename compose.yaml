services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bipme
      POSTGRES_USER: bipme
      POSTGRES_PASSWORD: bipme_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bipme -d bipme"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bipme_postgres:/var/lib/postgresql/data

volumes:
  bipme_postgres:
